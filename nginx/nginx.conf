# Single entrypoint: browser คุยแค่ :80 ที่นี่ที่เดียว
# /            -> frontend (Next.js, มี /api/* ของตัวเอง)
# /api/auth/   -> auth-service (strip prefix: /api/auth/login -> /login)
#
# ใช้ตัวแปร + resolver (127.0.0.11 = DNS ของ docker) resolve ใหม่ทุก request
# -> restart/recreate container แล้ว IP เปลี่ยนก็ไม่ 502

resolver 127.0.0.11 valid=10s;

server {
  listen 80;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  location / { set $upstream frontend:80; proxy_pass http://$upstream; }

  # rewrite ตัด prefix ก่อนส่งต่อ (proxy_pass มีตัวแปรต้องไม่มี URI ต่อท้าย)
  location /api/auth/ { set $upstream auth-service:3001; rewrite ^/api/auth/(.*)$ /$1 break; proxy_pass http://$upstream; }
  location /api/products/ { set $upstream product-service:3002; rewrite ^/api/products/(.*)$ /$1 break; proxy_pass http://$upstream; }
  location /api/orders/ { set $upstream order-service:3003; rewrite ^/api/orders/(.*)$ /$1 break; proxy_pass http://$upstream; }
  location /api/notifications/ { set $upstream notification-service:3004; rewrite ^/api/notifications/(.*)$ /$1 break; proxy_pass http://$upstream; }
  location /api/cart/ { set $upstream cart-service:3005; rewrite ^/api/cart/(.*)$ /$1 break; proxy_pass http://$upstream; }

  location /health {
    default_type application/json;
    return 200 '{"status":"ok","gateway":"nginx"}';
  }
}
