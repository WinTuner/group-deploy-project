# Single entrypoint: browser คุยแค่ :80 ที่นี่ที่เดียว
# /            -> frontend (Next.js, มี /api/* ของตัวเอง)
# /api/auth/   -> auth-service (strip prefix: /api/auth/login -> /login)
# /api/<svc>/  -> service นั้น ๆ (ดู mapping ข้างล่าง)
upstream frontend { server frontend:80; }
upstream auth { server auth-service:3001; }
upstream product { server product-service:3002; }
upstream order { server order-service:3003; }
upstream noti { server notification-service:3004; }
upstream cart { server cart-service:3005; }

server {
  listen 80;

  # ทุก request ผ่านนี่: ฝาก header ไว้ให้ backend เห็น IP จริง
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

  location / { proxy_pass http://frontend; }

  # proxy_pass ลงท้ายด้วย / = ตัด prefix /api/<svc>/ ออกก่อนส่งต่อ
  location /api/auth/ { proxy_pass http://auth/; }
  location /api/products/ { proxy_pass http://product/; }
  location /api/orders/ { proxy_pass http://order/; }
  location /api/notifications/ { proxy_pass http://noti/; }
  location /api/cart/ { proxy_pass http://cart/; }

  location /health {
    default_type application/json;
    return 200 '{"status":"ok","gateway":"nginx"}';
  }
}
