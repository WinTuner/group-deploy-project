services:
  auth-service:
    build: ./services/auth-service
    ports: ["3001:3001"]
    environment:
      PORT: 3001
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
  product-service:
    build: ./services/product-service
    ports: ["3002:3002"]
    environment:
      PORT: 3002
  order-service:
    build: ./services/order-service
    ports: ["3003:3003"]
    environment:
      PORT: 3003
      PRODUCT_SERVICE_URL: http://product-service:3002
    depends_on: [product-service]
  notification-service:
    build: ./services/notification-service
    ports: ["3004:3004"]
    environment:
      PORT: 3004
  cart-service:
    build: ./services/cart-service
    ports: ["3005:3005"]
    environment:
      PORT: 3005
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [auth-service]
  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [frontend, auth-service, product-service, order-service, notification-service, cart-service]
