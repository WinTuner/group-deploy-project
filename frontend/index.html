<!DOCTYPE html>
<html lang="th">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Group Project</title>
<style>body{font-family:sans-serif;display:flex;height:100vh;align-items:center;justify-content:center;background:#f3f4f6}form{background:#fff;padding:32px;border-radius:12px;box-shadow:0 4px 20px #0001;min-width:300px}input{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:8px}button{width:100%;padding:10px;background:#111827;color:#fff;border:0;border-radius:8px;cursor:pointer}#msg{margin-top:12px;font-size:14px}</style>
</head>
<body>
<form id="f">
  <h2>🔐 Login (auth-service)</h2>
  <p style="font-size:13px;color:#666">Owner: Member-5 (Frontend) · API: <code id="api"></code></p>
  <input id="u" placeholder="username (ลอง admin)" required>
  <input id="p" type="password" placeholder="password (password123)" required>
  <button>Login</button>
  <div id="msg"></div>
</form>
<script>
const API = (window.AUTH_API || 'http://localhost:3001');
document.getElementById('api').textContent = API;
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '...';
  try {
    const r = await fetch(API + '/login', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: u.value, password: p.value }) });
    const j = await r.json();
    msg.textContent = r.ok ? '✅ token: ' + j.token.slice(0,40) + '…' : '❌ ' + (j.error||r.status);
    msg.style.color = r.ok ? 'green' : 'red';
  } catch(err){ msg.textContent = '❌ ต่อ API ไม่ได้: '+err; msg.style.color='red'; }
};
</script>
</body>
</html>
